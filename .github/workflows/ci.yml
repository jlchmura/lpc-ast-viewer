name: CI

on:
  push:
  pull_request:
  schedule:
    # do this every day at 7AM UTC
    - cron: "0 7 * * *"
jobs:
  build:
    name: test ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: canary
      - name: npm install
        run: npm ci
      - name: Lint
        run: deno lint
      - uses: dprint/check@v2.2
      - name: Check
        run: deno task check
      - name: Build
        run: |
          deno task addTypeScriptVersions
          deno task updateCompilerFiles
          deno task test
          deno task predeploy
      # Deployment lives in deploy.yml, which builds against lpc-language-server's
      # main branch. Two workflows publishing to Pages would fight each other.
